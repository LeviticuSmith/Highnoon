<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Highnoon Stage Productions</title>
<meta name="description" content="Lighting, audio, vision and staging for events, venues and stages.">
<meta name="theme-color" content="#0A0E17">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--accent:#38BDF8;--bg:#0A0E17;--text:#F8FAFC;--surface:color-mix(in srgb,var(--text) 5%,var(--bg));--panel:var(--surface);--surface2:color-mix(in srgb,var(--text) 9%,var(--bg));--line:color-mix(in srgb,var(--text) 13%,var(--bg));--line2:color-mix(in srgb,var(--text) 22%,var(--bg));--muted:color-mix(in srgb,var(--text) 64%,var(--bg));--glow:color-mix(in srgb,var(--accent) 20%,transparent);--head:Inter,system-ui,-apple-system,sans-serif;--body:Inter,system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:84px;background:var(--bg)}
body{background:var(--bg);color:var(--text);font:400 16px/1.65 var(--body)}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:104px 24px}
h1,h2,h3{font-family:var(--head);font-weight:600;letter-spacing:-.03em;line-height:1.05}
h2{font-size:clamp(32px,4.6vw,52px);margin-bottom:36px}
.btn{display:inline-flex;align-items:center;background:var(--accent);color:var(--bg);font:600 15px var(--head);padding:12px 22px;border:1px solid var(--accent);border-radius:8px;cursor:pointer;text-decoration:none;transition:box-shadow .2s,background .2s}
.btn:hover{box-shadow:0 0 24px var(--glow)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line2)}
.btn.ghost:hover{background:var(--surface2);box-shadow:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(10px + env(safe-area-inset-top)) 24px 10px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font:600 14px var(--mono);color:var(--accent);white-space:nowrap}
.brand img{height:42px;width:auto}
nav{display:flex;align-items:center;gap:6px}
nav a{text-decoration:none;font-weight:500;font-size:14px;color:var(--muted);padding:7px 14px;border-radius:6px;transition:all .15s}
nav a:hover{color:var(--text);background:var(--surface2)}
nav .btn{margin-left:8px;padding:8px 16px;font-size:14px;color:var(--bg)}
nav .btn:hover{background:var(--accent);color:var(--bg)}
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;background-size:cover;background-position:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 55% at 78% 18%,var(--glow),transparent 70%),linear-gradient(180deg,color-mix(in srgb,var(--bg) 55%,transparent),var(--bg) 96%)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 72% 30%,#000,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 72% 30%,#000,transparent 75%);opacity:.7;pointer-events:none}
.hero .wrap{position:relative;z-index:1;width:100%;padding-bottom:84px}
.hero h1{font-size:clamp(46px,9vw,124px);max-width:12ch;margin-bottom:24px;letter-spacing:-.04em;line-height:1}
.lead{font-size:clamp(17px,2vw,21px);max-width:40ch;margin-bottom:16px;color:var(--muted)}
.tagline{font:500 14px var(--mono);margin-bottom:32px;color:var(--accent)}
.hero .btn+.btn{margin-left:8px}
.grid{display:grid;grid-template-columns:1fr;gap:20px}
.svc{display:grid;grid-template-columns:minmax(180px,1fr) 2fr;gap:14px 48px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:36px 32px 32px;transition:border-color .2s,box-shadow .2s}
.svc:hover{border-color:var(--accent);box-shadow:0 12px 40px var(--glow)}
.svc::before{content:"";grid-column:1/-1;display:block;width:32px;height:3px;border-radius:2px;background:var(--accent);margin-bottom:6px}
.svc h3{font-size:clamp(28px,4vw,40px);margin:0}
.svc p{white-space:pre-line;color:var(--muted)}
.work{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{position:relative;aspect-ratio:4/3;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0;cursor:pointer;overflow:hidden;color:var(--text);text-align:left;font:inherit;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:var(--accent);box-shadow:0 12px 40px var(--glow)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover img{transform:scale(1.04)}
.card div{position:absolute;inset:auto 0 0;padding:48px 18px 16px;background:linear-gradient(transparent,rgba(5,8,14,.9))}
.card small{display:block;color:var(--accent);font:500 13px var(--mono)}
.card h3{font-size:22px}
.empty{color:var(--muted)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:56px}
.two p{white-space:pre-line;max-width:60ch;color:var(--muted);font-size:18px}
.contact a{display:block;font:500 18px var(--mono);text-decoration:none;padding:16px 0;border-bottom:1px solid var(--line);transition:color .15s}
.contact a:hover{color:var(--accent)}
.alt{background:var(--surface);border-block:1px solid var(--line)}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:820px}
label{display:block;font-weight:500;font-size:14px;color:var(--muted)}
.full{grid-column:1/-1}
input,textarea,select{width:100%;margin-top:6px;background:var(--bg);border:1px solid var(--line2);color:var(--text);padding:12px 14px;font:inherit;border-radius:8px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--glow)}
.hp{position:absolute;left:-9999px}
#fm{grid-column:1/-1;min-height:1.6em}
footer{padding:32px 24px calc(32px + env(safe-area-inset-bottom));border-top:1px solid var(--line);text-align:center;font:400 13px var(--mono);color:var(--muted)}
.lb{position:fixed;inset:0;z-index:40;background:rgba(5,8,14,.94);overflow:auto;padding:40px 20px}
.lb>div{max-width:1000px;margin:0 auto}
.lb img{width:100%;max-height:70vh;object-fit:contain;background:#000;border-radius:12px}
.lb h3{font-size:40px;margin:20px 0 6px}
.lb p{white-space:pre-line;max-width:70ch;color:var(--muted)}
.x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:16px;z-index:50}
#admin{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;text-align:left}
#admin .in{max-width:900px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 20px 80px}
#admin h1{font-size:34px;margin-bottom:16px}
#admin .bar{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 24px;border-bottom:1px solid var(--line);padding-bottom:16px}
#admin .tb{background:none;border:1px solid transparent;color:var(--muted);padding:8px 16px;cursor:pointer;font:500 14px var(--head);border-radius:6px}
#admin .tb:hover{background:var(--surface2);color:var(--text)}
#admin .tb.on{background:var(--glow);color:var(--accent);border-color:var(--accent)}
#admin label{margin-bottom:14px}
.box{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:18px;margin-bottom:16px;display:grid;gap:4px}
.box img{max-width:220px;max-height:140px;object-fit:cover;margin-bottom:8px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sm{padding:7px 14px;font-size:14px}
#msg{margin:14px 0;font-weight:600}.bad{color:#f87171}
[hidden]{display:none!important}
.hero-logo{display:block;max-width:min(300px,70vw);max-height:230px;width:auto;margin-bottom:28px}
.strip{grid-column:1/-1;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px 0 0;padding:0 0 10px;scrollbar-width:thin}
.strip button{flex:none;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);cursor:pointer;scroll-snap-align:start}
.strip img{display:block;height:clamp(220px,34vw,380px);width:auto;max-width:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{background:transparent;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:7px 16px;font:500 14px var(--head);cursor:pointer}
.chip[aria-pressed=true]{background:var(--glow);color:var(--accent);border-color:var(--accent)}
.gal{columns:3 240px;column-gap:12px}
.gal button{display:block;width:100%;margin:0 0 12px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--surface);break-inside:avoid}
.gal img{display:block;width:100%;height:auto;transition:transform .4s}
.gal button:hover img{transform:scale(1.03)}
.pv{position:fixed;inset:0;z-index:45;background:rgba(5,8,14,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 16px 24px}
.pv>img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:8px}
.pv p{margin-top:12px;color:var(--muted);min-height:1.5em}
.pn{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:rgba(10,14,23,.7);color:var(--text);font-size:30px;line-height:1;cursor:pointer}
.pn.r{left:auto;right:12px}
.pg{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pg div{position:relative}
.pg img{height:84px;width:auto;max-width:none;border-radius:6px;display:block;margin:0}
.pg .btn{position:absolute;top:4px;right:4px;padding:0 9px;line-height:24px;font-size:16px}
@media(max-width:760px){.svc{grid-template-columns:1fr;padding:28px 20px 24px}}
@media(max-width:760px){nav a:not(.btn){display:none}.two{grid-template-columns:1fr;gap:32px}form{grid-template-columns:1fr}.wrap{padding:76px 20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#home"><img id="blogo" alt="" hidden><span id="co"></span></a>
  <nav><a href="#services">Services</a><a href="#work">Our work</a><a href="#gallery" id="ng" hidden>Gallery</a><a href="#about">About</a><a class="btn" href="#quote">Get a quote</a></nav>
</header>

<section class="hero" id="home"><div class="wrap">
  <img id="hlogo" class="hero-logo" alt="" hidden><h1 id="hh"></h1><p class="lead" id="ht"></p><p class="tagline" id="tg"></p>
  <a class="btn" href="#quote">Get a quote</a> <a class="btn ghost" href="#work">See our work</a>
</div></section>

<section id="services"><div class="wrap"><h2>What we do</h2><div class="grid" id="svc"></div></div></section>
<section id="work" class="alt"><div class="wrap"><h2>Our work</h2><div class="work" id="wk"></div></div></section>
<section id="gallery" hidden><div class="wrap"><h2>Gallery</h2><div class="chips" id="gch"></div><div class="gal" id="gl"></div></div></section>
<section id="about"><div class="wrap"><div class="two"><div><h2>About us</h2><p id="ab_t"></p></div><div class="contact" id="ct"></div></div></div></section>

<section id="quote" class="alt"><div class="wrap"><h2>Get a quote</h2>
<p class="lead" style="margin-bottom:28px">Tell us about your event and we will get back to you.</p>
<form id="qf">
  <label>Your name<input name="name" required maxlength="200" autocomplete="name"></label>
  <label>Email<input name="email" type="email" required maxlength="200" autocomplete="email"></label>
  <label>Phone<input name="phone" type="tel" maxlength="50" autocomplete="tel"></label>
  <label>Event type<select name="type"><option>Concert or festival</option><option>Corporate event</option><option>Wedding</option><option>Church or community</option><option>Theatre or school</option><option>Other</option></select></label>
  <label>Event date<input name="date" maxlength="100" placeholder="e.g. 14 March 2027"></label>
  <label>Venue<input name="venue" maxlength="200"></label>
  <label class="full">What do you need?<textarea name="msg" rows="5" maxlength="4000" placeholder="Lighting, audio, vision, staging, or a mix. Expected crowd size, set-up times, anything else."></textarea></label>
  <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div class="full"><button class="btn" type="submit">Send enquiry</button></div>
  <p id="fm" role="status"></p>
</form></div></section>
<footer id="ft"></footer>

<div class="lb" id="lb" hidden><button class="btn ghost x" id="lbx">Close</button><div id="lbc"></div></div>
<div class="pv" id="pv" hidden><button class="btn ghost x" id="pvx">Close</button><button class="pn" id="pvp" aria-label="Previous photo">&lsaquo;</button><img id="pvi" alt=""><button class="pn r" id="pvn" aria-label="Next photo">&rsaquo;</button><p id="pvc"></p></div>
<div id="admin" hidden><div class="in" id="ab"></div></div>

<script>
// Paste your Supabase Project URL and publishable key between the quotes, then save.
const CONFIG={URL:'https://tfkaawetfhtrvsgkysce.supabase.co',KEY:'sb_publishable_FMHQlRMhTIHlngJks9Rxqg_cyoM79m_'};

const DEF={company:'Highnoon Stage Productions',tagline:'Lighting. Audio. Vision. Staging.',hero_heading:'We build the show.',hero_text:'Full-service production for events, venues and stages.',services:['Lighting','Audio','Vision','Staging'].map(t=>({title:t,text:'Add your description here.'})),about:'Tell people who you are and what you do.',email:'',phone:'',instagram:'',colors:{accent:'#38BDF8',background:'#0A0E17',text:'#F8FAFC'}};
let photos=[],site={content:DEF,portfolio:[]},code=sessionStorage.hn||'',ed=null,cur='Text';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function rpc(fn,args){
  if(!CONFIG.URL)throw new Error('Not connected to Supabase yet. Add the Project URL and key at the top of the script.');
  const r=await fetch(CONFIG.URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CONFIG.KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}
  if(!r.ok)throw new Error((d&&d.message)||'Something went wrong. Try again.');
  return d;
}

function render(){
  const c=site.content,s=document.documentElement.style;let k={...DEF.colors,...c.colors};if(k.accent==='#E8A317'&&k.background==='#16181A')k=DEF.colors;
  s.setProperty('--accent',k.accent);s.setProperty('--bg',k.background);s.setProperty('--text',k.text);
  document.title=c.company;
  $('#co').textContent=c.company;
  [$('#hlogo'),$('#blogo')].forEach(i=>{i.hidden=false;i.onerror=()=>{i.hidden=true};i.src=c.logo||'logo.png'});$('#hh').textContent=c.hero_heading;$('#ht').textContent=c.hero_text;$('#tg').textContent=c.tagline;
  $('#home').style.backgroundImage=c.hero_image?`url("${c.hero_image}")`:'none';
  $('#svc').innerHTML=(c.services||[]).map((v,i)=>{const ps=photos.filter(p=>p.section=='service:'+i);return `<div class="svc"><h3>${esc(v.title)}</h3><p>${esc(v.text)}</p>${ps.length?`<div class="strip">${ps.map(p=>`<button data-ph="${p.id}" data-set="service:${i}" aria-label="View photo"><img src="${esc(p.thumb)}" alt="" loading="lazy"></button>`).join('')}</div>`:''}</div>`}).join('');
  $('#wk').innerHTML=site.portfolio.length?site.portfolio.map((p,i)=>`<button class="card" data-i="${i}">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">`:''}<div><small>${esc(p.category)}</small><h3>${esc(p.title)}</h3></div></button>`).join(''):'<p class="empty">Projects coming soon.</p>';
  $('#ab_t').textContent=c.about;
  const ig=c.instagram?(c.instagram.startsWith('http')?c.instagram:'https://instagram.com/'+c.instagram.replace('@','')):'';
  $('#ct').innerHTML=(c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:'')+(c.phone?`<a href="tel:${esc(c.phone.replace(/\s/g,''))}">${esc(c.phone)}</a>`:'')+(ig?`<a href="${esc(ig)}" target="_blank" rel="noopener">Instagram</a>`:'');
  $('#ft').textContent='© '+new Date().getFullYear()+' '+c.company;
  renderGal();
}

async function load(){
  try{const c=JSON.parse(localStorage.hn_site);site={content:{...DEF,...c.content},portfolio:c.portfolio||[]}}catch{}
  try{photos=JSON.parse(localStorage.hn_ph)||[]}catch{}
  render();
  if(!CONFIG.URL)return;
  try{const d=await rpc('get_site');site={content:{...DEF,...d.content},portfolio:d.portfolio||[]};render();try{localStorage.hn_site=JSON.stringify(site)}catch{}}catch{}
  try{photos=await rpc('get_photos');render();try{localStorage.hn_ph=JSON.stringify(photos)}catch{}}catch{}
}

$('#wk').onclick=e=>{const b=e.target.closest('.card');if(!b)return;const p=site.portfolio[+b.dataset.i];
  $('#lbc').innerHTML=(p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}">`:'')+`<h3>${esc(p.title)}</h3><p><strong>${esc([p.category,p.venue].filter(Boolean).join(' at '))}</strong></p><p>${esc(p.details)}</p>`;
  $('#lb').hidden=false};
$('#lbx').onclick=()=>$('#lb').hidden=true;
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').hidden=true});

$('#qf').onsubmit=async e=>{
  e.preventDefault();const f=e.target,m=$('#fm'),b=f.querySelector('button');
  if(f.website.value)return;
  b.disabled=true;m.className='';m.textContent='Sending...';
  try{
    await rpc('submit_enquiry',{p_name:f.name.value,p_email:f.email.value,p_phone:f.phone.value,p_event_type:f.type.value,p_event_date:f.date.value,p_venue:f.venue.value,p_message:f.msg.value});
    f.reset();m.textContent='Thanks. We have your enquiry and will be in touch soon.';
  }catch(x){m.className='bad';m.textContent=CONFIG.URL?'Your enquiry did not send: '+x.message:'The form is not connected yet. Please email us instead.'}
  b.disabled=false;
};


/* ---------- photos: gallery and full-screen viewer ---------- */
let gf='all',vs=[],vi=0;const full={};
const galList=()=>photos.filter(p=>gf=='all'||p.section==gf);
function renderGal(){
  const sv=site.content.services||[],keys=[...new Set(photos.map(p=>p.section))];
  if(gf!='all'&&!keys.includes(gf))gf='all';
  const nm=k=>k=='gallery'?'More':((sv[+k.split(':')[1]]||{}).title||k);
  $('#gallery').hidden=$('#ng').hidden=!photos.length;
  $('#gch').innerHTML=keys.length>1?[['all','All'],...keys.map(k=>[k,nm(k)])].map(([k,l])=>`<button class="chip" data-f="${esc(k)}" aria-pressed="${gf==k}">${esc(l)}</button>`).join(''):'';
  $('#gl').innerHTML=galList().map(p=>`<button data-ph="${p.id}" data-set="gal" aria-label="View photo"><img src="${esc(p.thumb)}" alt="${esc(p.caption||'')}" loading="lazy"></button>`).join('');
  watch($('#svc'));watch($('#gl'));
}
/* sharpen previews: swap in the full-size photo as each one scrolls into view */
async function upg(im){const b=im.closest('[data-ph]');if(!b)return;const id=+b.dataset.ph;
  if(!full[id])try{full[id]=await rpc('get_photo',{p_id:id})}catch{return}
  if(im.isConnected&&full[id])im.src=full[id]}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);upg(e.target)}}),{rootMargin:'300px'}):null;
function watch(root){if(io)root.querySelectorAll('[data-ph] img').forEach(i=>io.observe(i))}
async function showPh(){
  const p=vs[vi];if(!p)return;
  $('#pv').hidden=false;document.body.style.overflow='hidden';
  const im=$('#pvi');im.src=full[p.id]||p.thumb;$('#pvc').textContent=p.caption||'';
  $('#pvp').hidden=$('#pvn').hidden=vs.length<2;
  if(!full[p.id])try{const d=await rpc('get_photo',{p_id:p.id});full[p.id]=d;if(vs[vi]&&vs[vi].id==p.id)im.src=d}catch{}
}
const stepPh=d=>{vi=(vi+d+vs.length)%vs.length;showPh()};
const closePh=()=>{$('#pv').hidden=true;document.body.style.overflow=''};
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){gf=f.dataset.f;return renderGal()}
  const b=e.target.closest('[data-ph]');if(!b)return;
  vs=b.dataset.set=='gal'?galList():photos.filter(p=>p.section==b.dataset.set);
  vi=Math.max(0,vs.findIndex(p=>p.id==b.dataset.ph));showPh();
});
$('#pvx').onclick=closePh;$('#pvp').onclick=()=>stepPh(-1);$('#pvn').onclick=()=>stepPh(1);
document.addEventListener('keydown',e=>{if($('#pv').hidden)return;if(e.key=='Escape')closePh();if(e.key=='ArrowLeft')stepPh(-1);if(e.key=='ArrowRight')stepPh(1)});
let tx=0;$('#pv').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#pv').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)stepPh(d<0?1:-1)});
const fit=async(f,max,type,q)=>{let src;try{src=await createImageBitmap(f)}catch{src=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error('This photo could not be read. Try a JPG or PNG.'));im.src=URL.createObjectURL(f)})}
  const s=Math.min(1,max/Math.max(src.width,src.height)),c=document.createElement('canvas');c.width=Math.round(src.width*s);c.height=Math.round(src.height*s);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL(type,q)};

/* ---------- admin (open the site with #admin on the end of the address) ---------- */
function pick(cb,max=1600){const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();
    im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};
    im.src=URL.createObjectURL(f)};i.click()}
const say=(t,bad)=>{const m=$('#msg');if(m){m.className=bad?'bad':'';m.textContent=t}};
const fld=(l,p,v,area)=>`<label>${l}${area?`<textarea rows="3" data-p="${p}">${esc(v)}</textarea>`:`<input data-p="${p}" value="${esc(v)}">`}</label>`;
function setP(p,v){const k=p.split('.');let o=ed;k.slice(0,-1).forEach(x=>o=o[x]);o[k.at(-1)]=v}

function openAdmin(){$('#admin').hidden=false;document.body.style.overflow='hidden';code?start():login()}
function closeAdmin(){$('#admin').hidden=true;document.body.style.overflow=''}
window.onhashchange=()=>location.hash==='#admin'?openAdmin():closeAdmin();

function login(){
  $('#ab').innerHTML=`<h1>Admin</h1><label>Password<input id="pw" type="password" autocomplete="current-password"></label><div class="row"><button class="btn" data-act="login">Log in</button><button class="btn ghost" data-act="exit">Back to site</button></div><p id="msg"></p>`;
  $('#pw').onkeydown=e=>{if(e.key==='Enter')$('[data-act=login]').click()};
}
function start(){
  ed=structuredClone(site);ed.content.colors={...DEF.colors,...ed.content.colors};ed.content.services=ed.content.services||DEF.services;
  tab(cur);
}
function tab(n){
  cur=n;let h=`<h1>Edit site</h1><div class="bar">${['Text','Work','Photos','Enquiries','Look','Password'].map(t=>`<button class="tb${t==n?' on':''}" data-act="tab" data-n="${t}">${t}</button>`).join('')}<button class="tb" data-act="exit">Exit</button></div>`;
  const c=ed.content;
  if(n=='Text'){
    h+=fld('Company name','content.company',c.company)+fld('Tagline','content.tagline',c.tagline)+fld('Main heading','content.hero_heading',c.hero_heading)+fld('Intro line','content.hero_text',c.hero_text,1)
    +`<div class="box"><strong>Logo (a PNG with a see-through background looks best)</strong>${c.logo?`<img src="${esc(c.logo)}" alt="">`:''}<div class="row"><button class="btn sm" data-act="logo">Choose logo</button>${c.logo?'<button class="btn ghost sm" data-act="logox">Remove</button>':''}</div></div>`
    +`<div class="box"><strong>Hero photo</strong>${c.hero_image?`<img src="${esc(c.hero_image)}" alt="">`:''}<div class="row"><button class="btn sm" data-act="hero">Choose photo</button>${c.hero_image?'<button class="btn ghost sm" data-act="herox">Remove</button>':''}</div></div>`
    +c.services.map((v,i)=>`<div class="box"><strong>Service ${i+1}</strong>${fld('Title',`content.services.${i}.title`,v.title)}${fld('Description',`content.services.${i}.text`,v.text,1)}</div>`).join('')
    +fld('About us','content.about',c.about,1)+fld('Email','content.email',c.email)+fld('Phone','content.phone',c.phone)+fld('Instagram (handle or link)','content.instagram',c.instagram)
    +`<button class="btn" data-act="savec">Save changes</button>`;
  }else if(n=='Work'){
    h+=ed.portfolio.map((p,i)=>`<div class="box">${p.image?`<img src="${esc(p.image)}" alt="">`:''}${fld('Title',`portfolio.${i}.title`,p.title)}${fld('Type (e.g. Lighting)',`portfolio.${i}.category`,p.category)}${fld('Venue',`portfolio.${i}.venue`,p.venue)}${fld('Details',`portfolio.${i}.details`,p.details,1)}
    <div class="row"><button class="btn ghost sm" data-act="photo" data-i="${i}">${p.image?'Change photo':'Add photo'}</button><button class="btn ghost sm" data-act="up" data-i="${i}">Move up</button><button class="btn ghost sm" data-act="dn" data-i="${i}">Move down</button><button class="btn ghost sm" data-act="del" data-i="${i}">Delete</button></div></div>`).join('')
    +`<div class="row"><button class="btn ghost" data-act="add">Add project</button><button class="btn" data-act="savew">Save changes</button></div>`;
  }else if(n=='Photos'){
    const secs=[...c.services.map((v,i)=>['service:'+i,v.title]),['gallery','General gallery (extra photos)']];
    h+=secs.map(([k,t])=>`<div class="box"><strong>${esc(t)}</strong><div class="pg">${photos.filter(p=>p.section==k).map(p=>`<div><img src="${esc(p.thumb)}" alt=""><button class="btn sm" data-act="phdel" data-i="${p.id}" aria-label="Delete photo">&times;</button></div>`).join('')}</div><div class="row"><button class="btn ghost sm" data-act="phadd" data-k="${k}">Add photos</button></div></div>`).join('')+'<p class="empty">Photos added to a service appear as a scroll strip on its card. Every photo also appears in the Gallery.</p>';
  }else if(n=='Look'){
    h+=fld('Accent colour','content.colors.accent',c.colors.accent).replace('<input','<input type="color"')+fld('Background','content.colors.background',c.colors.background).replace('<input','<input type="color"')+fld('Text','content.colors.text',c.colors.text).replace('<input','<input type="color"')+`<button class="btn" data-act="savec">Save changes</button>`;
  }else if(n=='Password'){
    h+=`<label>New password (8 or more characters)<input id="np" type="password" autocomplete="new-password"></label><button class="btn" data-act="pw">Change password</button>`;
  }else{h+='<p>Loading...</p>'}
  $('#ab').innerHTML=h+'<p id="msg"></p>';
  if(n=='Enquiries')enq();
}
async function enq(){
  try{const l=await rpc('admin_list_enquiries',{p_code:code});
    $('#ab').insertAdjacentHTML('beforeend',l.length?l.map(q=>`<div class="box" style="${q.handled?'opacity:.5':''}"><strong>${esc(q.name)}</strong> <a href="mailto:${esc(q.email)}">${esc(q.email)}</a>${q.phone?` <a href="tel:${esc(q.phone)}">${esc(q.phone)}</a>`:''}<span>${esc([q.event_type,q.event_date,q.venue].filter(Boolean).join(' | '))}</span><span style="white-space:pre-line">${esc(q.message)}</span><small>${new Date(q.created_at).toLocaleString()}</small><div class="row"><button class="btn ghost sm" data-act="done" data-i="${q.id}" data-v="${!q.handled}">${q.handled?'Mark as new':'Mark as done'}</button><button class="btn ghost sm" data-act="delq" data-i="${q.id}">Delete</button></div></div>`).join(''):'<p class="empty">No enquiries yet.</p>');
    $('#msg').remove();
  }catch(x){say(x.message,1)}
}

$('#ab').oninput=e=>{const p=e.target.dataset.p;if(!p)return;setP(p,e.target.value);if(p.startsWith('content.')){site.content=ed.content;render()}};
$('#ab').onclick=async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i,w=ed&&ed.portfolio;
  try{
    if(a=='exit'){location.hash='';load();return}
    if(a=='login'){const v=$('#pw').value;if(await rpc('admin_check',{p_code:v})){code=v;sessionStorage.hn=v;start()}else say('Wrong password.',1);return}
    if(a=='tab')return tab(b.dataset.n);
    if(a=='logo'){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=async()=>{if(!inp.files[0])return;try{ed.content.logo=await fit(inp.files[0],700,'image/png');site.content=ed.content;render();tab('Text')}catch{say('Could not read that image.',1)}};inp.click();return}
    if(a=='logox'){delete ed.content.logo;site.content=ed.content;render();return tab('Text')}
    if(a=='phadd'){const k=b.dataset.k,inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;inp.style.display='none';document.body.append(inp);
      inp.onchange=async()=>{const fs=[...inp.files];let n=0,ok=0,fail=0,first='';
        for(const f of fs){say('Uploading '+(++n)+' of '+fs.length+'...');
          try{const img=await fit(f,1400,'image/jpeg',.78),th=await fit(f,560,'image/jpeg',.72);
            const id=await rpc('admin_add_photo',{p_code:code,p_section:k,p_caption:'',p_thumb:th,p_image:img});
            photos.push({id,section:k,caption:'',thumb:th});ok++}catch(x){fail++;first=first||(x&&x.message)||'could not be read'}}
        inp.remove();render();try{localStorage.hn_ph=JSON.stringify(photos)}catch{}
        tab('Photos');say(!fs.length?'No photos were picked.':(ok+' of '+fs.length+' photos added.'+(fail?' '+fail+' failed: '+first:'')),!ok)};
      inp.click();return}
    if(a=='phdel'){if(!confirm('Delete this photo?'))return;await rpc('admin_delete_photo',{p_code:code,p_id:i});photos=photos.filter(p=>p.id!=i);render();try{localStorage.hn_ph=JSON.stringify(photos)}catch{}return tab('Photos')}
    if(a=='hero')return pick(d=>{ed.content.hero_image=d;site.content=ed.content;render();tab('Text')},2000);
    if(a=='herox'){delete ed.content.hero_image;site.content=ed.content;render();return tab('Text')}
    if(a=='photo')return pick(d=>{w[i].image=d;tab('Work')});
    if(a=='add'){w.push({title:'New project',category:'',venue:'',details:'',image:''});return tab('Work')}
    if(a=='del'&&confirm('Delete this project?')){w.splice(i,1);return tab('Work')}
    if(a=='up'&&i>0){[w[i-1],w[i]]=[w[i],w[i-1]];return tab('Work')}
    if(a=='dn'&&i<w.length-1){[w[i+1],w[i]]=[w[i],w[i+1]];return tab('Work')}
    if(a=='savec'){say('Saving...');await rpc('admin_save_content',{p_code:code,p_content:ed.content});site.content=ed.content;render();say('Saved. The live site is updated.')}
    if(a=='savew'){say('Saving...');await rpc('admin_save_portfolio',{p_code:code,p_items:ed.portfolio});site.portfolio=structuredClone(ed.portfolio);render();say('Saved. The live site is updated.')}
    if(a=='pw'){await rpc('admin_change_password',{p_code:code,p_new:$('#np').value});code=$('#np').value;sessionStorage.hn=code;$('#np').value='';say('Password changed.')}
    if(a=='done'){await rpc('admin_set_enquiry_handled',{p_code:code,p_id:i,p_handled:b.dataset.v=='true'});tab('Enquiries')}
    if(a=='delq'&&confirm('Delete this enquiry?')){await rpc('admin_delete_enquiry',{p_code:code,p_id:i});tab('Enquiries')}
  }catch(x){if(/password/i.test(x.message)&&!/new|least/i.test(x.message)){code='';sessionStorage.removeItem('hn');login();say('Wrong password.',1)}else say(x.message,1)}
};

load();
if(location.hash==='#admin')openAdmin();
</script>
</body>
</html>
